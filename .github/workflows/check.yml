name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node scripts/catalog.ts --verify

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          for dir in functions/*/; do
            (cd "$dir" && deno check --no-lock index.ts) || exit 1
          done

  apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [auth-nextjs, auth-vue, api-express-rbac, sign-in-with-nulvless]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      NEXT_PUBLIC_NULVLESS_URL: https://example.nulvless.co
      NEXT_PUBLIC_NULVLESS_KEY: pk-example
      NULVLESS_SECRET: sk-example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build --if-present
      - run: npm run typecheck --if-present
