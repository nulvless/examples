<div style="background-color:#ffffff;margin:0;padding:0">
  <table
    border="0"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    role="presentation"
    align="center"
    style="background-color:#ffffff"
  >
    <tbody>
      <tr>
        <td style="padding:20px 10px">
          <table
            align="center"
            width="100%"
            border="0"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="max-width:460px;background-color:#ffffff;border:1px solid #e6ebf1;border-radius:8px;margin:0 auto;overflow:hidden"
          >
            <tbody>
              <tr>
                <td
                  style="padding:40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
                >
                  <h1
                    style="color:#000000;font-size:24px;font-weight:700;line-height:1.2;margin:0 0 16px"
                  >
                    Enable two-factor authentication
                  </h1>
                  <p style="font-size:16px;line-height:24px;color:#444444;margin:0 0 16px">
                    Enter this code to finish setting up two-factor authentication for your
                    account.
                  </p>
                  <table
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                    role="presentation"
                    style="margin:0 0 24px"
                  >
                    <tbody>
                      <tr>
                        <td
                          align="center"
                          bgcolor="#f4f5f7"
                          style="border-radius:6px;padding:16px 24px"
                        >
                          <span
                            style="font-family:SFMono-Regular,Consolas,'Liberation Mono',monospace;font-size:28px;line-height:32px;font-weight:700;letter-spacing:6px;color:#242038"
                          >
                            {{code}}
                          </span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                  <p style="font-size:14px;line-height:22px;color:#999999;margin:0">
                    This code expires soon and can only be used once. If you did not request
                    this, you can ignore this email.
                  </p>
                  <hr style="border:none;border-top:1px solid #e6ebf1;margin:32px 0" />
                  <p style="font-size:12px;line-height:18px;color:#999999;margin:0">
                    <span style="color:#000000">{{platform.name}}</span>
                  </p>
                </td>
              </tr>
            </tbody>
          </table>
          <table
            align="center"
            width="100%"
            border="0"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="max-width:460px;margin:24px auto 0"
          >
            <tbody>
              <tr>
                <td
                  align="center"
                  style="font-size:11px;line-height:18px;color:#999999;font-family:Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:1px"
                >
                  &copy; 2026 {{platform.name}}
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
</div>
